services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: eleven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local Docker}
      POSTGRES_DB: eleven
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleven -d eleven"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
